[project]
name = "hpc-mcp-server"
version = "0.1.0"
description = "Execution-aware LLM MCP server for Tapis Pods."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.3.0,<2",
    "deepspeed>=0.16.3,<0.17",
    "fastapi>=0.136.1,<0.137",
    "mcp>=1.26.0,<1.28",
    "numpy>=2.2.0,<3",
    "pandas>=2.2.3,<3",
    "pyyaml>=6.0.2,<7",
    "scikit-learn>=1.6.1,<2",
    "scipy>=1.15.0,<2",
    "torch>=2.5.1,<2.6",
    "transformers>=4.52.0,<5",
    "uvicorn[standard]>=0.40.0,<0.41",
    "xgboost>=3.2.0,<4",
]

[project.scripts]
hpc-mcp-server = "hpc_mcp_server.main:run"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[project]
name = "hpc-mcp-server-cpu"
version = "0.1.0"
description = "HPC MCP server."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.3.0,<2",
    "fastapi>=0.136.1,<0.137",
    "ijson>=3.4.0,<4",
    "mcp>=1.26.0,<1.28",
    "numpy>=2.2.0,<3",
    "pandas>=2.2.3,<3",
    "pyyaml>=6.0.2,<7",
    "scikit-learn>=1.6.1,<2",
    "scipy>=1.15.0,<2",
    "torch>=2.5.1,<2.6",
    "transformers>=4.52.0,<5",
    "uvicorn[standard]>=0.40.0,<0.41",
    "xgboost-cpu>=3.2.0,<4",
]

[project.scripts]
hpc-mcp-server-cpu = "hpc_mcp_server.main:run"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv.build-backend]
module-name = "hpc_mcp_server"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
